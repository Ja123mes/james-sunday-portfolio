<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Events | Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Trebuchet MS", Arial, sans-serif; background: #0f2a2e; color: #e6f7f5; line-height: 1.5; }
    .bar { background: #081a1d; padding: 10px 40px; font-size: 14px; }
    .bar a { color: #7ee8d8; text-decoration: none; }
    header { max-width: 1050px; margin: 0 auto; padding: 36px 24px 10px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
    header h1 { font-size: 40px; color: #7ee8d8; }
    header p { color: #9cc5c0; }
    .saved { background: #1d4a4f; border-radius: 30px; padding: 8px 20px; font-weight: bold; }
    .filters { max-width: 1050px; margin: 14px auto 0; padding: 0 24px; display: flex; gap: 8px; flex-wrap: wrap; }
    .filters button { background: transparent; color: #cfeeea; border: 2px solid #2a6168; border-radius: 30px; padding: 7px 20px; font: inherit; cursor: pointer; transition: all 0.2s; }
    .filters button:hover { border-color: #7ee8d8; }
    .filters button.active { background: #7ee8d8; color: #0f2a2e; border-color: #7ee8d8; font-weight: bold; }
    .grid { max-width: 1050px; margin: 20px auto 50px; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    .event { background: #16393e; border-radius: 16px; padding: 20px; border-top: 5px solid #7ee8d8; transition: transform 0.25s; display: flex; flex-direction: column; }
    .event:hover { transform: translateY(-5px); }
    .event.Workshop { border-top-color: #ffb74d; }
    .event.Social { border-top-color: #f48fb1; }
    .event.Career { border-top-color: #90caf9; }
    .event .date { font-size: 13px; color: #9cc5c0; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 0; }
    .event h2 { font-size: 20px; margin: 4px 0 8px; line-height: 1.3; }
    .event p { color: #b8d6d2; font-size: 15px; margin-bottom: 14px; }
    .kind { display: inline-block; font-size: 12px; background: #1d4a4f; border-radius: 20px; padding: 2px 12px; margin-bottom: 10px; align-self: flex-start; }
    .save { margin-top: auto; background: transparent; color: #7ee8d8; border: 2px solid #7ee8d8; border-radius: 30px; padding: 7px 16px; font: bold 14px inherit; cursor: pointer; transition: all 0.2s; }
    .save:hover { background: #1d4a4f; }
    .save.on { background: #7ee8d8; color: #0f2a2e; }
    @media (max-width: 700px) { .bar { padding: 10px 20px; } header h1 { font-size: 30px; } }
  </style>
</head>
<body>
  <div class="bar"><a href="index.html">&larr; Back to my portfolio</a> &nbsp;|&nbsp; Demo project: Campus Events Board</div>

  <header>
    <div>
      <h1>Campus Events</h1>
      <p>Find something to do this week and save what you like.</p>
    </div>
    <div class="saved" id="savedCount">Saved: 0</div>
  </header>

  <div class="filters" id="filters"></div>
  <div class="grid" id="eventGrid"></div>

  <script>
    // all events are stored in an array
    const events = [
      { title: "HTML & CSS Study Session", date: "Mon 23 Nov", type: "Study", info: "Practise layouts together and share tips.", saved: false },
      { title: "JavaScript Debugging Workshop", date: "Tue 24 Nov", type: "Workshop", info: "Learn how to find and fix bugs faster.", saved: false },
      { title: "Career Talk: Life as a Developer", date: "Wed 25 Nov", type: "Career", info: "A guest speaker shares how they started.", saved: false },
      { title: "Student Game Night", date: "Thu 26 Nov", type: "Social", info: "Chess, scrabble and snacks. Everyone welcome.", saved: false },
      { title: "Python Revision Group", date: "Fri 27 Nov", type: "Study", info: "Go through past questions step by step.", saved: false },
      { title: "CV and Portfolio Clinic", date: "Sat 28 Nov", type: "Career", info: "Get feedback on your CV and your website.", saved: false }
    ];
    const types = ["All", "Study", "Workshop", "Career", "Social"];
    let currentType = "All";

    const filtersDiv = document.getElementById("filters");
    const eventGrid = document.getElementById("eventGrid");

    // filter buttons
    function showFilters() {
      filtersDiv.innerHTML = "";
      for (let i = 0; i < types.length; i++) {
        const button = document.createElement("button");
        button.textContent = types[i];
        if (types[i] === currentType) {
          button.classList.add("active");
        }
        button.addEventListener("click", function () {
          currentType = types[i];
          showFilters();
          showEvents();
        });
        filtersDiv.appendChild(button);
      }
    }

    // event cards
    function showEvents() {
      eventGrid.innerHTML = "";
      let savedCount = 0;

      for (let i = 0; i < events.length; i++) {
        const e = events[i];
        if (e.saved) {
          savedCount++;
        }
        if (currentType !== "All" && e.type !== currentType) {
          continue;
        }

        const card = document.createElement("article");
        card.className = "event " + e.type;
        card.innerHTML = '<p class="date"></p><h2></h2><span class="kind"></span><p></p>';
        card.querySelector(".date").textContent = e.date;
        card.querySelector("h2").textContent = e.title;
        card.querySelector(".kind").textContent = e.type;
        card.querySelectorAll("p")[1].textContent = e.info;

        const saveButton = document.createElement("button");
        saveButton.className = "save";
        saveButton.type = "button";
        saveButton.textContent = e.saved ? "Saved ✓" : "Save event";
        if (e.saved) {
          saveButton.classList.add("on");
        }
        saveButton.addEventListener("click", function () {
          e.saved = !e.saved;
          showEvents();
        });
        card.appendChild(saveButton);
        eventGrid.appendChild(card);
      }

      document.getElementById("savedCount").textContent = "Saved: " + savedCount;
    }

    showFilters();
    showEvents();
  </script>
</body>
</html>
